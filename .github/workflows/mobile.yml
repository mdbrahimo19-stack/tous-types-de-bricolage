name: App mobile (Flutter)

# Compile l'application unique client + professionnel (dossier mobile_ia/).
on:
  push:
    paths:
      - "mobile_ia/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile_ia/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_ia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - run: flutter pub get

      - name: Analyse du code
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      # Clé de signature fixe (secrets GitHub) : chaque APK s'installe par-dessus le précédent.
      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Secrets de signature absents : APK signé avec une clé de test."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties

      # APK optimisé pour les téléphones récents (arm64).
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      # Empreinte du certificat : doit être identique d'une compilation à l'autre.
      - name: Empreinte de signature
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E 'SHA256|Owner'

      - uses: actions/upload-artifact@v4
        with:
          name: ttb-apk
          path: mobile_ia/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # APK téléchargeable directement depuis le téléphone (onglet Releases).
      - name: Publier l'APK dans la release « apk-test »
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk bricolages-test.apk
          NOTES="APK de test (client + professionnel) — branche ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. Remplacée à chaque compilation."
          gh release delete apk-test --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-test bricolages-test.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "APK de test (dernière compilation)" --notes "$NOTES"
