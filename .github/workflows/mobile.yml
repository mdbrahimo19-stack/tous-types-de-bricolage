name: App mobile (Flutter)

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      # Le dossier android/ est généré s'il n'est pas encore dans le dépôt.
      - name: Générer le projet Android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org dz.ttb --project-name ttb .
            python3 ../tools/ci/patch_android.py android
          fi

      - run: flutter pub get

      - name: Analyse du code
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build APK (debug)
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: ttb-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
